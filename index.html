<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Studio — Layered SVG library</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <h1>Studio</h1>
    <p class="tagline">
      Layered, no-gradient, 3D-look SVGs — generated by a local AI,
      stored as a tagged, searchable library.
    </p>
    <nav class="tools" style="margin-bottom:8px">
      <a href="verify.html" style="background:var(--accent);color:white;padding:6px 12px;border-radius:6px;text-decoration:none;font-weight:600">▶ Verify &amp; fine-tune</a>
      <a href="generator.html" style="background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:6px;text-decoration:none">Generator playground</a>
    </nav>
    <nav class="tools">
      <input id="q" type="search" placeholder="Search title, prompt, tags, slug..." />
      <select id="type">
        <option value="">all types</option>
      </select>
      <select id="palette">
        <option value="">all palettes</option>
      </select>
      <span id="count" class="count"></span>
    </nav>
  </header>

  <main id="gallery" class="grid" aria-live="polite"></main>

  <dialog id="detail" class="detail">
    <article id="detail-body"></article>
    <form method="dialog"><button class="close" autofocus>close</button></form>
  </dialog>

  <footer>
    <p>
      <a href="https://github.com/monksudo/carnatic_music">Source</a> ·
      <a href="generator.html">Generator playground</a> ·
      every visual is sanitized to remove gradients and clamp colors to the active palette.
    </p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
